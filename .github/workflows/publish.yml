name: Publish the Spice Labs plugin API

# The plugin SPI (io.spicelabs:spice-plugin-api) is a standalone artifact that
# versions and releases independently, following its own Java API SemVer. It
# ships on its own tag, `v<x.y.z>`, to GitHub Packages and Maven Central.
# SNAPSHOT versions are published to GitHub Packages on every push to main by
# snapshot.yml. Release the plugin-api before a BOM release that bumps its
# managed spice-plugin-api version (see RELEASING.md).
on:
  push:
    tags:
      - "v*"

jobs:
  publish_plugin_api:
    name: Publish spice-plugin-api to GitHub Packages and Maven Central
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and extract version from tag
        id: validate
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "Tag does not match plugin-api version pattern v*.*.*" >&2
            exit 1
          fi

      - name: Set up JDK 21 and GitHub Maven auth
        # setup-java imports the GPG key (gpg-private-key/gpg-passphrase) and
        # sets up Maven. The `github` server auth is written explicitly in the
        # next step (settings.xml heredoc) using GITHUB_ACTOR/GITHUB_TOKEN env
        # vars, so server-username/server-password are left at their defaults.
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
          server-id: github
          token: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          gpg-private-key: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Write settings.xml for GitHub + Maven Central
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">

            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
            </servers>

          </settings>
          EOF

      - name: Verify the tag matches the version in the pom
        env:
          VERSION: ${{ steps.validate.outputs.VERSION }}
        run: |
          # `versions:set` below overwrites whatever the pom says, so without this
          # check the tag is the only thing deciding what ships — and a tag is easy to
          # get wrong. The pom is where the intended version is declared and reviewed;
          # requiring them to agree makes the tag a confirmation rather than a
          # decision made alone at push time.
          POM_VERSION=$(mvn --batch-mode --quiet help:evaluate \
            -Dexpression=project.version -DforceStdout)
          if [ "${POM_VERSION%-SNAPSHOT}" != "$VERSION" ]; then
            echo "Tag v${VERSION} does not match pom version ${POM_VERSION}." >&2
            echo "Set the pom to ${VERSION}-SNAPSHOT before tagging, or tag v${POM_VERSION%-SNAPSHOT}." >&2
            exit 1
          fi
          echo "Tag v${VERSION} matches pom ${POM_VERSION}."

      - name: Verify the major version matches SpiceContext.API_VERSION
        env:
          VERSION: ${{ steps.validate.outputs.VERSION }}
        run: |
          # `spice` mounts a plugin only when its apiVersion() equals the CLI's
          # API_VERSION exactly, so every bump of that constant breaks every existing
          # plugin. Tying it to the major version means the coordinate a consumer
          # depends on carries that fact, rather than leaving it in a constant nobody
          # sees until a plugin silently stops loading.
          API_VERSION=$(grep -oE "int API_VERSION = [0-9]+" \
            src/main/java/io/spicelabs/cli/spi/SpiceContext.java | grep -oE "[0-9]+$")
          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" != "$API_VERSION" ]; then
            echo "Major version ${MAJOR} does not match SpiceContext.API_VERSION ${API_VERSION}." >&2
            echo "An API_VERSION bump is a breaking change and requires a major release." >&2
            exit 1
          fi
          echo "Major version ${MAJOR} matches API_VERSION ${API_VERSION}."

      - name: Set plugin-api version from tag
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.validate.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Publish plugin-api to GitHub Packages
        run: mvn --batch-mode clean deploy -P github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      - name: Publish plugin-api to Maven Central
        run: mvn --batch-mode clean deploy -P maven-central
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
